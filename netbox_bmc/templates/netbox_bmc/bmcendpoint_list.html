{% extends "generic/object_list.html" %}
{% load i18n %}

{% block javascript %}
{{ block.super }}
<script>
document.querySelectorAll('.bmc-power-status').forEach(function (el) {
  const i18n = {
    error: "{% trans 'error' %}",
    unknown: "{% trans 'unknown' %}",
    unreachable: "{% trans 'unreachable' %}",
  };
  fetch(el.dataset.url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      el.textContent = data.error ? i18n.error : (data.state ? data.state.toLowerCase() : i18n.unknown);
    })
    .catch(function () { el.textContent = i18n.unreachable; });
});
</script>
{% endblock %}
